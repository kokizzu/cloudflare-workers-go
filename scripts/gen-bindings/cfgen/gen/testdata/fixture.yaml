package: widgets
doc: |
  Package widgets is a synthetic fixture package used only by cfgen's
  golden test. It exercises: a handle type, a data type, a string-literal
  alias enum, a Promise-returning method, a Record-returning method, an
  array field, an optional field, a rename, a types override, a
  handwritten method, extends-flattening (GeoExt inherits and overrides a
  field from GeoBase), intersection-flattening (GeoCombined merges a ref
  and an inline object literal), and a parameter rename override
  (Widget.notify's parameter, whose extracted name is a raw destructured-
  object pattern rather than a valid Go identifier).
include:
  - Widget
  - WidgetInfo
  - WidgetStatus
  - WidgetFactory
  - GeoBase
  - GeoExt
  - GeoCombined
bindings:
  - Widget
rename:
  WidgetInfo.widget_name: Name
  # Widget.notify's sole parameter is extracted with the raw destructuring
  # pattern "{ note }" as its "name" (mirrors WorkflowInstance.sendEvent in
  # exp/internal/gen/overrides/workflows.yaml, tmp/06-codegen-spec.md 6.2
  # item 1) rather than a valid Go identifier; this renames it to "note".
  "Widget.notify.{ note }": note
types:
  WidgetInfo.cacheTtl: "*int"
exclude:
  - WidgetInfo.internalNote
handwritten:
  - WidgetFactory.create
