package: workflows
doc: |
  Package workflows provides the Workflows binding
  (https://developers.cloudflare.com/workflows/).
include:
  - Workflow
  - WorkflowInstance
  - WorkflowInstanceCreateOptions
  - WorkflowInstanceTerminateOptions
  - WorkflowInstanceRestartOptions
  - WorkflowInstanceLocationHint
  - WorkflowBatchDeleteResult
  - InstanceStatus
  - WorkflowRetentionDuration
bindings:
  - Workflow
types:
  # PARAMS is a TypeScript generic type parameter (the workflow's
  # user-defined event payload shape); cfgen does not generate Go generics,
  # so it is passed through as an opaque js.Value.
  WorkflowInstanceCreateOptions.params: "js.Value"
  # WorkflowRetentionDuration = WorkflowSleepDuration = (a template-literal
  # type like `${number} ${"second"|"minute"|...}${"s"|""}` | number),
  # which extract.ts can't resolve (template-literal types round-trip as
  # "unsupported"). WorkflowRetentionDuration is only reachable today via
  # WorkflowInstanceCreateOptions.retention's inline
  # {successRetention?, errorRetention?} object literal (itself synthesized
  # into its own data type per 5.1 item 1); since a "types:" override can
  # only target a synthesized type's *own* field once cfgen has already
  # invented its name (not known ahead of time in this YAML), this decl is
  # instead added to include directly and overridden at the decl level, so
  # the ref from the synthesized type resolves to it.
  WorkflowRetentionDuration: "js.Value"
exclude:
  # createBatch takes an array of WorkflowInstanceCreateOptions<PARAMS> and
  # returns an array of WorkflowInstance handles; a batch API is left for a
  # follow-up rather than generating an under-designed one now.
  - Workflow.createBatch
  # sendEvent's single parameter is a destructured object literal in the
  # .d.ts ({ type, payload }); the IR records its "name" as the raw
  # destructuring pattern text, which is not a valid Go identifier, so it
  # cannot be generated as an ordinary method parameter.
  - WorkflowInstance.sendEvent
