name = "durable-object-go"
main = "./build/worker.mjs"
# streams_enable_constructors (needed by other _examples pinned to an
# earlier compatibility_date) has been the default since 2022-11-30, so it
# doesn't need to be (and, per wrangler, must not be) listed explicitly here.
compatibility_date = "2024-04-01"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[build]
command = "make build"
